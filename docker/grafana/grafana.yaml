apiVersion: 1

prune: true

datasources:
- name: Tempo
  type: tempo
  access: proxy
  url: http://tempo:3200/
  basicAuth: false
  isDefault: true
  editable: false
  jsonData:
    httpMethod: GET
    tracesToLogsV2:
      datasourceUid: Loki
      filterByTraceID: true
- name: Loki
  type: loki
  access: proxy
  url: http://loki:3100
  jsonData:
    maxLines: 1000
