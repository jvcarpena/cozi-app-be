apiVersion: 1

prune: true

datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  editable: false

- name: Tempo
  type: tempo
  access: proxy
  url: http://tempo:3200/
  basicAuth: false
  editable: false
  jsonData:
    httpMethod: GET
    tracesToLogsV2:
      datasourceUid: Loki
      filterByTraceID: true
    tracesToMetrics:
      datasourceUid: Prometheus
    serviceMap:
      datasourceUid: Prometheus

- name: Loki
  type: loki
  access: proxy
  url: http://loki:3100
  jsonData:
    maxLines: 1000
