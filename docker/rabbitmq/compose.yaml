services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
#      - "15672:15672" TRAEFIK WILL NOW HANDLE THIS SINCE IT IS THE MAIN ENTRY POINT TO ALL THE SERVICES
    environment:
      RABBITMQ_DEFAULT_USER: cozi
      RABBITMQ_DEFAULT_PASS: cozi1234
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - traefik-public
      - rabbitmq_network

volumes:
  rabbitmq_data:
    driver: local

networks:
  traefik-public:
    external: true
  rabbitmq_network:
    name: rabbitmq_network
    driver: bridge
